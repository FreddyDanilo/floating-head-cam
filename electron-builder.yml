appId: com.electron.app
productName: Floating Head Cam
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Floating Head Cam
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone for recording audio.
    NSScreenCaptureUsageDescription: Application requests access to capture the screen for recording.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  icon: build/icon.png
  maintainer: Freddy Danilo <freddydanilo@users.noreply.github.com>
  vendor: Freddy Danilo <freddydanilo@users.noreply.github.com>
  category: Utility
snap:
  plugs:
    - browser-support
    - desktop
    - desktop-legacy
    - home
    - pulseaudio
    - unity7
    - upower-observe
    - wayland
    - x11
    - network
    - network-bind
    - opengl
    - camera
    - audio-record
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
releaseNotesFile: build/release-notes.md
publish:
  provider: github
  owner: FreddyDanilo
  repo: floating-head-cam
